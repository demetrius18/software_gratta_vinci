<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recupero password - Gratta e Vinci</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f4;font:15px system-ui;color:#23362c}.card{width:min(460px,94vw);background:white;padding:32px;border:1px solid #e2e7e3;border-radius:18px}h1{font-size:26px}label{display:block;margin:15px 0 5px}input,button{width:100%;padding:12px;border-radius:9px;font:inherit}input{border:1px solid #cdd6cf}button{border:0;background:#264d35;color:white;margin-top:18px;cursor:pointer}a{display:block;margin-top:16px;color:#264d35}#status{min-height:24px;margin-top:14px}</style></head><body><main class="card"><h1>Recupero password</h1><p id="description">Inserisci l'email dell'account per ricevere un nuovo link.</p><form id="request"><label>Email</label><input id="email" type="email" required autocomplete="email"><button>Invia link di recupero</button></form><form id="update" hidden><label>Nuova password (minimo 8 caratteri)</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><label>Ripeti la password</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password"><button>Salva nuova password</button></form><p id="status" role="status"></p><a href="login.html">Torna all'accesso</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gv-config.js"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),client=supabase.createClient(GV_CONFIG.url,GV_CONFIG.key),status=s=>$('status').textContent=s;let recovery=false;const showUpdate=()=>{recovery=true;$('request').hidden=true;$('update').hidden=false;$('description').textContent='Imposta una nuova password per il tuo account.';status('');};client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showUpdate();});const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error'))status('Link non valido o scaduto. Richiedine uno nuovo.');if(hash.get('type')==='recovery'&&hash.get('access_token')){const {error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''});if(error)status('Link non valido o scaduto. Richiedine uno nuovo.');else showUpdate();}else if(new URLSearchParams(location.search).get('code')){const {error}=await client.auth.exchangeCodeForSession(new URLSearchParams(location.search).get('code'));if(!error)showUpdate();else status('Link non valido o scaduto. Richiedine uno nuovo.');}
$('request').onsubmit=async e=>{e.preventDefault();status('Invio in corso…');const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo});status(error?'Errore: '+error.message:'Se l’indirizzo è registrato, riceverai una nuova email. Usa soltanto il link più recente.');};$('update').onsubmit=async e=>{e.preventDefault();if(!recovery){status('Apri il link di recupero ricevuto via email.');return;}if($('password').value!==$('confirm').value){status('Le password non coincidono.');return;}status('Salvataggio…');const {error}=await client.auth.updateUser({password:$('password').value});if(error){status('Errore: '+error.message);return;}await client.auth.signOut();location.replace('login.html?password=updated');};})();
</script></body></html>
