<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso Gratta e Vinci</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f4;font:15px system-ui;color:#23362c}.card{width:min(460px,94vw);background:white;padding:34px;border:1px solid #e2e7e3;border-radius:18px;box-shadow:0 16px 48px #1a322014}h1{font-size:29px;letter-spacing:-.04em;margin:5px 0 10px}p{color:#67756b}label{display:block;margin:16px 0 5px;font-size:13px}input,select{width:100%;padding:13px;border:1px solid #cdd6cf;border-radius:9px;font:inherit}button{border:0;border-radius:9px;background:#264d35;color:white;padding:13px 17px;font:600 14px system-ui;cursor:pointer;margin-top:18px;width:100%}button.secondary{background:#e9eeeb;color:#264d35}#status{min-height:22px;margin-top:12px;color:#8a3d30;font-size:13px}</style></head><body><main class="card"><small>GESTIONALE MULTISEDE</small><h1>Accesso operatori</h1><p>Accedi con l'account autorizzato e seleziona la sede.</p><section id="credentials"><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Accedi</button></form><a href="reset-password.html" style="display:block;margin-top:14px;color:#264d35">Password dimenticata?</a></section><section id="sites" hidden><label>Sede autorizzata</label><select id="sede"></select><button id="open" type="button">Apri gestionale</button><button class="secondary" id="admin" type="button">Apri direzione</button><button class="secondary" id="logout" type="button">Esci dall'account</button></section><div id="status" role="status"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gv-config.js"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),client=supabase.createClient(GV_CONFIG.url,GV_CONFIG.key);let sites=[];const msg=s=>$('status').textContent=s;
async function showSites(){try{const {data:{user},error:ue}=await client.auth.getUser();if(ue||!user){$('credentials').hidden=false;$('sites').hidden=true;return;}const {data:members,error:me}=await client.from('gv_utenti_sedi').select('sede_id,ruolo').eq('user_id',user.id);if(me)throw me;if(!members?.length)throw Error('Utente senza sedi autorizzate');const ids=members.map(x=>x.sede_id);const {data,error}=await client.from('gv_sedi').select('*').in('id',ids);if(error)throw error;sites=(data||[]).map(s=>({...s,ruolo:members.find(m=>String(m.sede_id)===String(s.id))?.ruolo}));$('sede').replaceChildren(...sites.map(s=>new Option(s.nome||s.name||String(s.id),s.id)));const prev=sessionStorage.getItem('gv_selected_sede');if(sites.some(s=>String(s.id)===prev))$('sede').value=prev;$('credentials').hidden=true;$('sites').hidden=false;msg('');}catch(e){msg('Accesso non autorizzato: '+e.message);$('sites').hidden=true;}}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('Verifica credenziali…');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg(error.message);return;}await showSites();};
function choose(target){sessionStorage.setItem('gv_selected_sede',$('sede').value);location.href=target;}
$('open').onclick=()=>choose('index.html');$('admin').onclick=()=>choose('admin.html');$('logout').onclick=async()=>{await client.auth.signOut();sessionStorage.removeItem('gv_selected_sede');$('sites').hidden=true;$('credentials').hidden=false;msg('Sessione terminata');};
await showSites();})();
</script></body></html>
